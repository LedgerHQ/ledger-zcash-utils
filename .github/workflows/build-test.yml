name: Build & Test

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheapest gate, so it runs on its own rather than three times in the matrix
  # below: no Rust toolchain, no cargo cache, node dependencies only.
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Check markdown formatting
        run: pnpm format:check

  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install

      # The addon must prove on every core, while the zcash-crypto crate on its
      # own stays single-threaded. Workspace builds unify the feature, so no
      # test would notice either wiring breaking; resolve each package alone.
      - name: Check the multicore feature wiring
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          if ! cargo tree -p zcash-ffi-node -e features -i halo2_proofs | grep -q 'halo2_proofs feature "multicore"'; then
            echo "::error::zcash-ffi-node no longer enables halo2_proofs/multicore"
            exit 1
          fi
          if cargo tree -p zcash-crypto -e features -i halo2_proofs | grep -q 'feature "multicore"'; then
            echo "::error::zcash-crypto enables multicore by default"
            exit 1
          fi

      - name: Build NAPI addon
        run: pnpm napi build --platform --release --cargo-cwd crates/zcash-ffi-node

      # The addon must load on a Windows machine without the Visual C++
      # Redistributable, so it may import no DLL of the MSVC runtime.
      - name: Check the addon links the C runtime statically
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents index.win32-x64-msvc.node | Out-String
          Write-Output $deps
          if ($LASTEXITCODE -ne 0 -or $deps -notmatch '(?i)kernel32\.dll') {
            Write-Output "::error::could not read the imports of index.win32-x64-msvc.node"
            exit 1
          }
          if ($deps -match '(?i)vcruntime|msvcp|api-ms-win-crt') {
            Write-Output "::error::index.win32-x64-msvc.node imports the MSVC C runtime"
            exit 1
          }

      - name: Smoke-test NAPI surface
        run: pnpm napi-smoke

      - name: Run Rust tests
        run: cargo test --workspace
