name: Publish Release

# Releases are driven by changesets alone. A merge to main that brings pending
# changesets opens (or updates) the "release: version packages" pull request;
# merging that pull request is the release: the package is built, packed,
# attested and published, then tagged and released on GitHub.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

# No workflow-level concurrency: a pending run would be superseded by the next
# push to main, and the run for a merged version pull request could then be
# cancelled before it publishes. Each job that writes takes its own group below.

jobs:
  # ── Step 0: Decide between versioning, publishing and nothing ───────────────
  select-mode:
    name: Select mode
    # Only main releases: a manual run from another branch would publish, tag
    # and release code that never went through a pull request. Every other job
    # depends on this one and is skipped with it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `version` when changesets are pending, `publish` when package.json holds
      # a version the registry does not have yet, `none` otherwise.
      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  # ── Step 1: Open or update the "release: version packages" pull request ─────
  version:
    name: Update the version pull request
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    # Only the latest state of main matters for the version pull request.
    concurrency:
      group: ${{ github.workflow }}-version
      cancel-in-progress: true
    permissions:
      contents: write # push the release branch
      pull-requests: write # open or update the pull request
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Commits go through the GitHub API, so they are signed by GitHub and
      # satisfy the signed-commit rule on main once the pull request merges.
      # The script also carries the new version into the npm/* platform packages.
      - name: Version packages
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm version-packages
          commit-message: "release: version packages"
          pr-title: "release: version packages"

  # ── Step 2a: Build .node binaries (NAPI — Node.js/Electron) ─────────────────
  build-napi:
    name: NAPI ${{ matrix.target }}
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-latest
            target: darwin-x64
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: ubuntu-latest
            target: linux-x64-gnu
            rust_target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: linux-arm64-gnu
            rust_target: aarch64-unknown-linux-gnu
            args: --target aarch64-unknown-linux-gnu
          - os: windows-latest
            target: win32-x64-msvc
            rust_target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
          - os: windows-latest
            target: win32-arm64-msvc
            rust_target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install ARM64 cross-compilation toolchain
        if: matrix.target == 'linux-arm64-gnu'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install dependencies
        run: pnpm install

      - name: Build NAPI addon
        run: pnpm napi build --platform --release --cargo-cwd crates/zcash-ffi-node ${{ matrix.args }}

      - name: Upload .node artifact
        uses: actions/upload-artifact@v4
        with:
          name: napi-${{ matrix.target }}
          path: "*.node"
          if-no-files-found: error

  # ── Step 2b: Build CLI binaries ──────────────────────────────────────────────
  build-cli:
    name: CLI ${{ matrix.name }}
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
            script: build-cli-macos.sh
            artifact: dist/ledger-zcash-cli-macos-universal
          - os: ubuntu-latest
            name: linux-x86_64
            script: build-cli-linux.sh
            artifact: dist/ledger-zcash-cli-linux-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.name }}

      - name: Build CLI
        run: ./scripts/${{ matrix.script }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # ── Step 3: Publish to JFrog, then tag and release on GitHub ─────────────────
  publish:
    name: Publish to JFrog
    runs-on: public-ledgerhq-shared-medium
    needs: [select-mode, build-napi, build-cli]
    if: needs.select-mode.outputs.mode == 'publish'
    # Serialised, never cancelled: a publish must not be dropped in favour of a
    # later run that selected another mode.
    concurrency:
      group: ${{ github.workflow }}-publish
      cancel-in-progress: false
    permissions:
      id-token: write # JFrog OIDC login and attestation signing
      contents: write # git tag, GitHub Release and its assets
      attestations: write # SLSA provenance of the published tarball

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish

      - name: Download all .node binaries
        uses: actions/download-artifact@v4
        with:
          pattern: napi-*
          path: artifacts

      # Each binary ships in its own npm/<triple> package, which the main
      # package lists as an optional dependency pinned to the same version.
      - name: Move .node binaries into their platform packages
        run: |
          set -euo pipefail
          pnpm napi artifacts
          node scripts/sync-platform-packages.mjs --optional-dependencies
          for dir in npm/*/; do
            main=$(node -p "require('./${dir}package.json').main")
            test -f "${dir}${main}" || { echo "::error::missing ${dir}${main}"; exit 1; }
          done

      - name: Regenerate index.js and index.d.ts from Rust source
        run: pnpm napi build --platform --release --cargo-cwd crates/zcash-ffi-node

      - name: Download CLI binaries
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist/
          merge-multiple: true

      - name: Cargo tests (host only)
        run: cargo test --workspace

      - name: 🔑 Login to JFrog Ledger
        id: jfrog-login-publish
        uses: LedgerHQ/actions-security/actions/jfrog-login@actions/jfrog-login-1

      - name: ⚙️ Configure npmrc
        shell: bash
        env:
          INPUTS_REGISTRY: ${{ vars.ARTIFACTORY_PUBLISH_URL }}
          INPUTS_TOKEN: ${{ steps.jfrog-login-publish.outputs.oidc-token }}
        run: |
          cat << EOF >> "${HOME}/.npmrc"
          @ledgerhq:registry=https://${INPUTS_REGISTRY}/
          //${INPUTS_REGISTRY}/:_authToken=${INPUTS_TOKEN}
          EOF

      # Packing is separate from publishing so the exact tarball can be attested
      # first. `changeset pack` only packs versions the registry does not have
      # yet, which is why it runs after the npmrc above points at JFrog; it
      # writes `packages/*.tgz` plus `publish-plan.json` (the tarball integrity)
      # into the output directory, and an already-published version yields an
      # empty plan, keeping a re-run idempotent. Changesets only knows the main
      # package, so each platform package the registry does not have yet is
      # packed next to it with pnpm, to be attested and published alongside.
      - name: 📦 Pack the packages
        id: pack
        env:
          OUT_DIR: ${{ runner.temp }}/changesets-pack
        run: |
          set -euo pipefail
          pnpm exec changeset pack --out-dir "$OUT_DIR"

          : > "$OUT_DIR/platform-tarballs.txt"
          for dir in npm/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if [ "$(pnpm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$name@$version is already published"
            else
              pnpm pack --dir "$dir" --pack-destination "$OUT_DIR/packages" | tail -n 1 >> "$OUT_DIR/platform-tarballs.txt"
            fi
          done

          shopt -s nullglob
          tarballs=("$OUT_DIR"/packages/*.tgz)
          shopt -u nullglob

          {
            echo "out-dir=$OUT_DIR"
            echo "count=${#tarballs[@]}"
          } >> "$GITHUB_OUTPUT"
          echo "Packed ${#tarballs[@]} tarball(s) into $OUT_DIR"

      # Provenance must be generated on a GitHub-hosted runner, which this
      # runner is. Skipped on an empty plan: the action fails when it finds
      # nothing to attest.
      - name: 🔏 Attest the tarballs
        if: steps.pack.outputs.count != '0'
        # actions/attest-for-npmsjs-com-0.1.2
        uses: LedgerHQ/actions-security/actions/attest-for-npmsjs-com@c92cff0840fbb28663c0061698e5e8ac5228dcce
        with:
          subject-path: ${{ steps.pack.outputs.out-dir }}/packages

      # Platform packages go first, so the main package never resolves to an
      # optional dependency the registry does not have yet.
      - name: 🚀 Publish the platform packages to JFrog
        env:
          OUT_DIR: ${{ steps.pack.outputs.out-dir }}
        run: |
          set -euo pipefail
          while read -r tarball; do
            pnpm publish "$tarball" --no-git-checks
          done < "$OUT_DIR/platform-tarballs.txt"

      # Publishes the attested tarball byte for byte, then pushes the `v<version>`
      # tag and creates the GitHub Release through the API.
      - name: 🚀 Publish to JFrog, tag and release
        id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm exec changeset publish --from-pack-dir "${{ steps.pack.outputs.out-dir }}"

      - name: 📎 Attach CLI binaries to GitHub Release
        if: steps.publish.outputs.published == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ fromJSON(steps.publish.outputs.published-packages)[0].version }}
          files: |
            dist/ledger-zcash-cli-macos-universal
            dist/ledger-zcash-cli-linux-x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
