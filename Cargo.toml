[workspace]
resolver = "2"
members = [
    "crates/zcash-crypto",
    "crates/zcash-sync",
    "crates/zcash-ffi-node",
    "crates/zcash-ffi-mobile",
    "crates/zcash-cli",
]
default-members = ["crates/zcash-crypto"]

# ──────────────────────────────────────────────────────────────────────────────
# Shared dependency versions — all crates inherit from here.
# Individual crates may add extra features on top (e.g. lightwalletd-tonic).
# ──────────────────────────────────────────────────────────────────────────────
[workspace.dependencies]

# Zcash ecosystem
# RC pin: swap to the 0.24.0 stable release when published, re-run tests,
# before the mainnet release cut.
zcash_client_backend  = { version = "=0.24.0-rc.7", default-features = false }
zcash_keys            = { version = "0.16", features = ["orchard", "sapling"] }
# Note: `transparent-inputs` is now a default feature of zcash-crypto.
zcash_address         = "0.13"
zcash_note_encryption = "0.4"
zcash_primitives      = { version = "0.30", default-features = false }
# Transparent-pool address + script types; pulled by zcash_primitives internally
# under the local alias `transparent`. We depend on it directly to avoid that alias.
zcash_transparent     = "0.10"
zcash_protocol        = "0.10"
zip32                 = "0.2"
orchard               = { version = "0.15", default-features = false }
sapling-crypto        = { version = "0.7", default-features = false }
# Field-element trait (`PrimeField::to_repr`) used to serialize the Orchard
# spend-auth randomizer `alpha` back to bytes when parsing a PCZT. Pinned to the
# same 0.13 line that `orchard` already depends on (no lockfile churn).
ff                    = "0.13"
# Transparent script (de)serialization: the `Evaluable::to_bytes` trait used to
# read a PCZT input/output `script_pubkey` back to raw bytes. Pinned to the 0.4
# line already pulled transitively by `zcash_transparent`.
zcash_script          = "0.4"

# Async / gRPC (only zcash-sync and its dependents need these)
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
# `tls-webpki-roots` is not redundant with `tls-native-roots`: the two are
# additive, and Android has no native root store to read. `rustls-native-certs`
# looks in /etc/ssl/certs, which does not exist there (Android keeps its CAs in
# /system/etc/security/cacerts), so rustls ends up with zero trusted roots and
# refuses to build a TLS config -- "TLS config failed: transport error", seen on
# the emulator 2026-09-21. Bundling Mozilla's root store makes the mobile build
# work; desktop keeps following the OS trust store as before.
tonic = { version = "0.14", features = ["codegen", "transport", "tls-native-roots", "tls-webpki-roots", "tls-ring"] }

# FFI
napi         = { version = "2.16", features = ["async"] }
napi-derive  = "2.16"

# Key derivation
bip39     = "2"
# Keep the lock on the 0.32.x maintenance line: the parallel 0.32.10x feature line sorts
# higher, so a broad `cargo update` silently drifts onto it.
bitcoin   = "0.32"
# secp256k1 0.29.x is already in Cargo.lock (transitive via bitcoin + zcash_transparent).
# Declared explicitly here so zcash-crypto can name the secp256k1::PublicKey that
# zcash_primitives::Builder::add_transparent_p2pkh_input expects.
secp256k1 = { version = "0.29", features = ["alloc"] }

# Parallelism
rayon   = "1"
futures = "0.3"

# Merkle tree for on-demand witness computation.
# Must match the copy zcash_client_backend links (0.7), or the tree types diverge under
# identical names and witnesses cannot cross.
incrementalmerkletree = "0.8"
shardtree             = "0.7"

# Partially Created Zcash Transaction format (wire format + role helpers).
# Used to (a) wrap the PcztParts returned by zcash_primitives::Builder::build_for_pczt,
# (b) drive the IoFinalizer + Prover roles, (c) emit the canonical PCZT byte stream.
# Pinned exactly: this defines the byte stream the firmware parses, so it moves only as a
# deliberate, tested step — never as a side effect of `cargo update`.
pczt = { version = "=0.9.3", default-features = false, features = [
    "std", "orchard", "transparent", "zcp-builder", "io-finalizer", "prover",
    "signer", "tx-extractor", "spend-finalizer",
] }

# RNG plumbing for build_for_pczt(rng, &fee) and the PCZT Prover.
rand      = "0.8"
rand_core = "0.6"

# Utilities
anyhow     = "1"
thiserror  = "1"
hex        = "0.4"
uuid       = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
time       = { version = "0.3", features = ["std"] }
clap       = { version = "4", features = ["derive"] }

# Test utilities (dev-only)
assert_cmd = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1

# Mobile static/shared libraries MUST NOT use LTO.
#
# With `lto = true` rustc emits LLVM bitcode into the archive instead of native
# object code. Rust 1.97's LLVM 22 bitcode is unreadable by Xcode's toolchain,
# which fails with:
#   Unknown attribute kind (105)
#   (Producer: 'LLVM22.1.6-rust-1.97.1-stable' Reader: 'LLVM APPLE_1_2100.1.1.101_0')
# `nm` cannot list the exported symbols and the iOS link step cannot consume the
# archive. Verified 2026-09-08: with lto=true the `.a` exports nothing; with
# lto=false it exports `_zcash_orchard_address_from_ufvk` and `_zcash_string_free`
# (and shrinks 74M -> 29M, an archive of native objects rather than bitcode).
#
# Kept as a separate profile so the Node/Electron and CLI release builds keep LTO.
# Build mobile artifacts with: cargo build --profile mobile --target <ios|android>
[profile.mobile]
inherits = "release"
lto = false
